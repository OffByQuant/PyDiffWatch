# Code-level primitive and obfuscation signals. Weights are baseline defaults — tune for your corpus.
- id: syntax-error-suspicious
  description: A complete .py/.pyi file fails to parse (often obfuscation, packing, or a dropped binary blob); Cython .pyx never counts, and outside auto-exec files syntax newer than the running interpreter under a Requires-Python floor is scored by syntax-newer-than-runtime instead.
  applies_to: code
  weight: 20
  location_scaled: true
  attack_type: obfuscation
  match: {syntax_error: true}

- id: syntax-newer-than-runtime
  description: A complete .py/.pyi file outside auto-exec locations fails to parse on this interpreter, and the release's Requires-Python floor is newer; it could not be scanned, but the model can read it.
  applies_to: code
  weight: 10
  location_scaled: true
  attack_type: unparsed-code
  match: {newer_syntax: true}

- id: primitives
  description: >
    Any import-bound dangerous primitive (process/exec/network/decode/credential) OR an encoded blob is
    present on added lines. Corroboration only — fixed low weight; the combos and auto-exec rules escalate.
    max_total 35 (under the default threshold_t of 40) means it can never escalate a release alone.
  applies_to: code
  weight: 5
  max_total: 35
  location_scaled: true
  attack_type: primitive-use
  match:
    any:
      - bound_call: {category: [decode, exec, process, network, credential]}
      - blob_present: true

- id: autoexec-location
  description: >
    A dangerous primitive (process/exec/network) that RUNS AT IMPORT TIME in an auto-exec location
    (setup.py, pyproject.toml, __init__.py, .pth) — where install/import-time supply-chain malware must
    live. autoexec_call (not bound_call) excludes primitives buried in method bodies that only run when
    the package's own runtime calls them (a runtime feature, not an install hook).
  applies_to: code
  weight: 45
  attack_type: install-hook
  match:
    all:
      - location_at_least: 3.0
      - any:
          - autoexec_call: {category: process}
          - autoexec_call: {category: exec}
          - autoexec_call: {category: network}

- id: encoded-url-literal
  description: An added string literal outside test files is a base64-encoded http(s) URL (a hidden endpoint).
  applies_to: code
  weight: 45
  attack_type: obfuscated-loader
  match:
    all:
      - location_at_least: 1.0
      - encoded_url: true
